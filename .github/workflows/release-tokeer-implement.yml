name: Release tokeer-implement

on:
  push:
    branches:
      - tokeer-implement
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tokeer-implement
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tokeer-implement
        uses: actions/checkout@v4
        with:
          ref: tokeer-implement
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Python syntax
        run: python3 -m compileall -q main.py py_modules

      - name: Commit compiled frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist/index.js; then
            echo "dist/index.js is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/index.js
            git commit -m "Build tokeer-implement frontend [skip ci]"
            git push origin HEAD:tokeer-implement
          fi

      - name: Restore tracked dist support files for packaging
        run: git checkout HEAD -- dist/container dist/dist dist/umipcompatd 2>/dev/null || true

      - name: Package Decky plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact SLSDeckUniversal-tokeer-implement.zip
          mkdir -p artifact/SLSDeckUniversal
          cp -a dist main.py plugin.json py_modules artifact/SLSDeckUniversal/
          for p in defaults assets LICENSE README.md; do
            if [ -e "$p" ]; then cp -a "$p" artifact/SLSDeckUniversal/; fi
          done
          cd artifact
          zip -qr ../SLSDeckUniversal-tokeer-implement.zip SLSDeckUniversal

      - name: Update rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tokeer-implement-latest"
          TITLE="SLSDeck Tokeer implementation"
          NOTES="Rolling prerelease built automatically from the tokeer-implement branch."

          git fetch origin --tags --force
          git tag -f "$TAG" HEAD
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target tokeer-implement
          fi

          gh release upload "$TAG" SLSDeckUniversal-tokeer-implement.zip --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLSDeckUniversal-tokeer-implement
          path: SLSDeckUniversal-tokeer-implement.zip
          if-no-files-found: error
          retention-days: 14

# Trigger: guided Tokeer prepare/verify/redeem UI.
