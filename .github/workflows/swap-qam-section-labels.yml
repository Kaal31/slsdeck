name: Swap QAM section labels

on:
  workflow_dispatch:
  push:
    branches: [tokeer-implement]
    paths:
      - '.github/workflows/swap-qam-section-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tokeer-implement
          fetch-depth: 0
      - name: Swap GameTools title
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/sections/GameTools.tsx')
          s = p.read_text()
          old = '<PanelSection title="This game">'
          new = '<PanelSection title="Actions & fixes">'
          assert old in s, 'GameTools title not found'
          p.write_text(s.replace(old, new, 1))
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sections/GameTools.tsx
          git commit -m 'Finish swapping QAM section labels' || exit 0
          git push origin HEAD:tokeer-implement
