name: Rename Hypervisor Bypass Module

on:
  push:
    branches: [tokeer-implement]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tokeer-implement
      - name: Rename legacy hypervisor UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdvancedPage.tsx')
          s = p.read_text()
          s = s.replace('label="Show Decky HV tab"', 'label="Show Hypervisor Bypass Module tab"')
          s = s.replace('Show the legacy Decky HV hypervisor controls in Advanced. Hidden by default; Anti-Denuvo now uses the Tokeer page.', 'Show the Hypervisor Bypass Module controls in Advanced. Hidden by default; Anti-Denuvo uses the Tokeer page.')
          s = s.replace('title: "Decky HV"', 'title: "Hypervisor Bypass Module"')
          p.write_text(s)
          PY
      - name: Commit rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdvancedPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Rename hypervisor bypass module [skip ci]"
          git push
