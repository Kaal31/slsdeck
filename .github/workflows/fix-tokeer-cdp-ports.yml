name: Fix Tokeer CDP multi-port discovery

on:
  workflow_dispatch:
  push:
    branches: [tokeer-implement]
    paths:
      - '.github/workflows/fix-tokeer-cdp-ports.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tokeer-implement
          fetch-depth: 0
      - name: Probe both local Steam CEF debugger ports
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/tokeerDiscordCapture.ts')
          s = p.read_text()
          old = '''async function listCdpTabs(): Promise<CdpTab[]> {
  try {
    const r = await fetchNoCors("http://localhost:8080/json");
    const tabs: CdpTab[] = await r.json();
    return Array.isArray(tabs) ? tabs : [];
  } catch {
    return [];
  }
}'''
          new = '''async function listCdpTabs(): Promise<CdpTab[]> {
  const all: CdpTab[] = [];
  for (const port of [8080, 8081]) {
    try {
      const r = await fetchNoCors(`http://localhost:${port}/json`);
      const tabs: CdpTab[] = await r.json();
      if (Array.isArray(tabs)) all.push(...tabs);
    } catch {
      /* this debugger port may not be exposed on this Steam/Decky build */
    }
  }
  // The same target can be exposed on both ports. Merge by websocket URL when
  // possible, otherwise by URL/title/type so we do not probe it twice.
  const seen = new Set<string>();
  return all.filter((t) => {
    const key = String(t.webSocketDebuggerUrl || `${t.type || ''}|${t.title || ''}|${t.url || ''}`);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}'''
          assert old in s, 'listCdpTabs block not found'
          p.write_text(s.replace(old, new, 1))
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/tokeerDiscordCapture.ts
          git commit -m 'Probe both Steam CEF debugger ports for Discord' || exit 0
          git push origin HEAD:tokeer-implement
