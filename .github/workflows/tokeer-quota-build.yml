name: Tokeer quota integration build

on:
  push:
    branches: [tokeer-implement]

permissions:
  contents: write

jobs:
  integrate-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tokeer-implement

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Wire Tokeer RPC
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('main.py')
          s = p.read_text()
          old = 'updates, watchdog, workshop, multiplayer,\n)'
          new = 'updates, watchdog, workshop, multiplayer, tokeer,\n)'
          if old not in s and 'multiplayer, tokeer,' not in s:
              raise SystemExit('main.py import anchor not found')
          if old in s:
              s = s.replace(old, new, 1)
          marker = 'class Plugin:\n'
          method = '''class Plugin:\n    # ── Tokeer / Anti-Denuvo ────────────────────────────────────────────────\n    async def tokeer_quota_probe(self) -> Dict[str, Any]:\n        return await self._run(tokeer.quota_probe)\n\n'''
          if 'async def tokeer_quota_probe(' not in s:
              if marker not in s:
                  raise SystemExit('Plugin class anchor not found')
              s = s.replace(marker, method, 1)
          p.write_text(s)

          p = Path('src/api.ts')
          s = p.read_text()
          block = '''\n// ── Tokeer / Anti-Denuvo ──────────────────────────────────────────────────\nexport interface TokeerQuotaProbe {\n  success: boolean;\n  status: number;\n  url?: string;\n  json: any;\n  raw: string;\n  contentType?: string;\n  parseError?: string;\n  error?: string;\n}\nexport const tokeerQuotaProbe = callable<[], TokeerQuotaProbe>("tokeer_quota_probe");\n'''
          if 'export const tokeerQuotaProbe' not in s:
              anchor = '// ── Callables ──────────────────────────────────────────────────────────────\n'
              if anchor not in s:
                  raise SystemExit('api.ts callable anchor not found')
              s = s.replace(anchor, block + '\n' + anchor, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Python syntax
        run: python3 -m compileall -q main.py py_modules

      - name: Commit integration and compiled bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py src/api.ts dist/index.js
          git diff --cached --quiet && exit 0
          git commit -m "Wire Tokeer quota probe and build [skip ci]"
          git push
