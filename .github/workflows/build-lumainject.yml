name: Build lumainject

on:
  push:
    branches:
      - lumainject
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lumainject
        uses: actions/checkout@v4
        with:
          ref: lumainject

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Python syntax
        run: python3 -m compileall -q main.py py_modules

      - name: Commit compiled dist
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist; then
            echo "dist is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Build lumainject frontend [skip ci]"
          git push origin HEAD:lumainject

      - name: Package Decky plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/SLSDeckUniversal
          cp -a dist main.py plugin.json py_modules artifact/SLSDeckUniversal/
          for p in defaults assets LICENSE README.md; do
            if [ -e "$p" ]; then cp -a "$p" artifact/SLSDeckUniversal/; fi
          done
          cd artifact
          zip -qr ../SLSDeckUniversal-lumainject.zip SLSDeckUniversal

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: SLSDeckUniversal-lumainject
          path: SLSDeckUniversal-lumainject.zip
          if-no-files-found: error
          retention-days: 14
