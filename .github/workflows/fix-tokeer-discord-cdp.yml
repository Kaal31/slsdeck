name: Fix Tokeer Discord CDP detection

on:
  workflow_dispatch:
  push:
    branches: [tokeer-implement]
    paths:
      - '.github/workflows/fix-tokeer-discord-cdp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tokeer-implement
          fetch-depth: 0
      - name: Patch Discord target discovery
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/tokeerDiscordCapture.ts')
          s = p.read_text()
          old = '''interface CdpTab { url: string; title?: string; webSocketDebuggerUrl?: string }'''
          new = '''interface CdpTab { url: string; title?: string; type?: string; webSocketDebuggerUrl?: string; resolvedUrl?: string }'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''function isDiscordTab(t: CdpTab): boolean {
  return !!t.webSocketDebuggerUrl && /(^|\\.)discord\\.com(?:\\/|$)/i.test(String(t.url || "").replace(/^https?:\\/\\//i, ""));
}

async function findDiscordTab(): Promise<CdpTab | null> {
  const discord = (await listCdpTabs()).filter(isDiscordTab);
  if (!discord.length) return null;
  return discord.find((t) => t.url?.includes(TOKEER_CHANNEL)) || discord[0];
}'''
          new = '''function looksLikeDiscordUrl(url: string): boolean {
  return /(^|\\.)discord\\.com(?:\\/|$)/i.test(String(url || "").replace(/^https?:\\/\\//i, ""));
}

function isDiscordTab(t: CdpTab): boolean {
  return !!t.webSocketDebuggerUrl && (looksLikeDiscordUrl(t.resolvedUrl || "") || looksLikeDiscordUrl(t.url || ""));
}

/** Steam sometimes exposes an outer webview URL in /json instead of the URL
 * visibly rendered in the page. Probe the actual JS execution context so a
 * Discord tab can still be found when CDP metadata says about:blank/Steam/etc. */
async function resolveTabUrl(t: CdpTab): Promise<string> {
  if (!t.webSocketDebuggerUrl) return String(t.url || "");
  if (looksLikeDiscordUrl(t.url || "")) return String(t.url || "");
  const expr = `(function(){try{return String(location.href||document.URL||'');}catch(e){return '';}})()`;
  const live = await evalJson(t.webSocketDebuggerUrl, expr, 1800);
  return typeof live === "string" && live ? live : String(t.url || "");
}

async function findDiscordTab(): Promise<CdpTab | null> {
  const tabs = (await listCdpTabs()).filter((t) => !!t.webSocketDebuggerUrl);

  // Fast path: normal CDP metadata already exposes discord.com.
  const direct = tabs.filter((t) => looksLikeDiscordUrl(t.url || ""));
  if (direct.length) {
    return direct.find((t) => t.url?.includes(TOKEER_CHANNEL)) || direct[0];
  }

  // Steam's external-web surface can report an outer target URL. Ask each live
  // JS context what page it is actually rendering instead of trusting /json.
  for (const tab of tabs) {
    const resolvedUrl = await resolveTabUrl(tab);
    if (!looksLikeDiscordUrl(resolvedUrl)) continue;
    const resolved = { ...tab, resolvedUrl, url: resolvedUrl };
    if (resolvedUrl.includes(TOKEER_CHANNEL)) return resolved;
    return resolved;
  }
  return null;
}'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/tokeerDiscordCapture.ts
          git commit -m 'Detect Discord through live CEF execution context' || exit 0
          git push origin HEAD:tokeer-implement
